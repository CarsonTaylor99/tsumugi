name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: pyright --strict (hard rule 9)
        run: uv run pyright
      - name: Round-trip gates + tests (hard rule 2)
        run: uv run pytest -q
